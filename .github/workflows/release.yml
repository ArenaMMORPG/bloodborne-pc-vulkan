name: Publish Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package prebuilt Linux x86_64 archive
        run: |
          tar -czf bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz \
            play.sh launcher.sh run.sh bin \
            out/bb-probe out/bb-gpu-capabilities \
            out/libbbport_dlss.so out/libnvidia-ngx-dlss.so.310.9.1 \
            out/gpu/libbbgpu.so out/gpu/libbbnet20.so out/gpu/libbbnet.so \
            fsr4_shaders
          sha256sum bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz > bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Bloodborne PC Vulkan ${{ github.ref_name }} (Linux x86_64 Prebuilt — DirectVk + 2,940 C++20 Engine + DLSS 4.5)"
          body: |
            ## Bloodborne PC Vulkan ${{ github.ref_name }} — Linux `x86_64` Prebuilt Release

            ### Included in `bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz`:
            - **`out/gpu/libbbgpu.so`**: Complete `2,940 / 2,940` Decompiled C++20 Graphics Engine (`152,420 LOC`) + Direct Vulkan 1.3 RHI (`DirectBuffers` & `DirectTextures`, `0` page faults/s, `2.5–3.5 GiB` VRAM) + 96 Native GLSL Shaders + 3D World-Space `SceneOcclusionCuller`.
            - **In-Game `System -> Controls` & `System -> Display` Overhaul**:
              - **DLSS 4.5 Transformer (`Preset M` & `Preset L`)**, **DLSS 4 (`Preset K`)**, **DLAA (`100%`)**, **FSR 3.1**, **FSR 4**, **TAA**, **FXAA**.
              - Live upscaler & resolution scaling (`Quality 67%`, `Balanced 58%`, `Performance 50%`, `Ultra Perf. 33%`), live `16x` Anisotropic Filtering, live `Model Detail (LOD)`, and persistent `FPS Limit` — all switching in real time with **0 restarts required**.
            - **`out/bb-probe` & `out/bb-gpu-capabilities`**: Linux `x86_64` runtime loader & GPU capability detector.
            - **`out/libbbport_dlss.so` & `out/libnvidia-ngx-dlss.so.310.9.1`**: Bundled NVIDIA NGX DLSS 4.5 (`v310.9.1`) bridge & runtime.
            - **`fsr4_shaders/`**: Precompiled SPIR-V shaders for AMD FSR 4.

            > **Note:** These prebuilt binaries are also bundled directly inside the `main` git branch, so simply running `git clone https://github.com/ArenaMMORPG/bloodborne-pc-vulkan.git && cd bloodborne-pc-vulkan && ./play.sh` works out of the box!
          files: |
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz
            bloodborne-pc-vulkan-linux-x86_64-prebuilt.tar.gz.sha256
